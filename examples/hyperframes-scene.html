<!-- ============================================================
  Example 2: HyperFrames-style scene — elements are trimmed to
  time slots with data-start / data-duration (seconds), the same
  convention HeyGen's HyperFrames uses. Each element becomes an
  AE layer whose in/out points match its slot.
  1920x1080 · 30fps · 10s.
============================================================= -->
<style>
  body { margin: 0; background: #12100e; }

  .stage { position: absolute; inset: 0; }

  .kicker {
    position: absolute; left: 810px; top: 380px; width: 300px;
    font: 700 36px Arial, sans-serif; color: #ffb44c;
    letter-spacing: 14px; text-align: center; text-transform: uppercase;
    animation: fadeUp .8s ease-out both;
  }

  .headline {
    position: absolute; left: 460px; top: 440px; width: 1000px;
    font: 900 120px "Arial Black", Arial, sans-serif;
    color: #fff6e8; text-align: center; letter-spacing: 2px;
    animation: popIn 1s cubic-bezier(.16, 1, .3, 1) both;
  }

  .chip {
    position: absolute; left: 860px; top: 640px; width: 200px; height: 64px;
    background: #ff5ca8; border-radius: 32px;
    font: 800 30px/64px Arial, sans-serif; color: #fff; text-align: center;
    animation: popIn .7s cubic-bezier(.16, 1, .3, 1) both;
  }

  .bar1 { position: absolute; left: 200px;  top: 900px; width: 340px; height: 22px; background: #3ddc97; border-radius: 11px; animation: slideL .9s ease-out both; }
  .bar2 { position: absolute; left: 790px;  top: 960px; width: 340px; height: 22px; background: #5cc8ff; border-radius: 11px; animation: slideR .9s ease-out .15s both; }

  .flare {
    position: absolute; left: 660px; top: 40px; width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,180,76,.30), rgba(255,180,76,0) 65%);
    animation: breathe 4s ease-in-out infinite;
  }

  @keyframes fadeUp { 0% { transform: translateY(40px); opacity: 0 } 100% { transform: translateY(0); opacity: 1 } }
  @keyframes popIn  { 0% { transform: scale(.5); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
  @keyframes slideL { 0% { transform: translateX(-500px); opacity: 0 } 100% { transform: translateX(0); opacity: 1 } }
  @keyframes slideR { 0% { transform: translateX(500px); opacity: 0 } 100% { transform: translateX(0); opacity: 1 } }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .7 } 50% { transform: scale(1.25); opacity: 1 } }
</style>

<div class="stage">
  <div class="flare" data-start="0" data-duration="10"></div>
  <div class="kicker"  data-start="0.2" data-duration="9.8">chapter 01</div>
  <div class="headline" data-start="0.4" data-duration="6">GOD LEVEL</div>
  <div class="chip"    data-start="1.1" data-duration="5.3">MCP</div>
  <div class="bar1"    data-start="0.8" data-duration="9.2"></div>
  <div class="bar2"    data-start="1.0" data-duration="9"></div>
</div>
